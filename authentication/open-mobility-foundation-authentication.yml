notes:
- All MDS Provider, Agency, and Metrics APIs require authentication; Policy, Geography and Jurisdiction APIs must
  be unauthenticated and public (per General Information).
- Authorization header carries "Bearer <token>"; JWT (RFC 7519) is RECOMMENDED as the token format.
- OAuth 2.0's client_credentials grant type (RFC 6749 section 4.4) is RECOMMENDED as the authentication and authorization
  scheme; producers MAY define token scopes.
- 'MDS is a specification with no fixed server: each regulatory agency or mobility provider hosts its own implementation
  and issues its own tokens.'
