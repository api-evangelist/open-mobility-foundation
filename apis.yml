aid: open-mobility-foundation

name: Open Mobility Foundation

description: The Open Mobility Foundation (OMF) is a city-governed, open source foundation that stewards open data standards such as the Mobility
  Data Specification (MDS) and the Curb Data Specification (CDS), used by cities and their technology partners to manage shared mobility (scooters,
  bike share, car share, taxis, TNCs, AVs, delivery robots) and digitize public space and curbs. It brings together public and private sector
  stakeholders to develop the standards, OpenAPI definitions and tools for the public right-of-way.

image: https://www.openmobilityfoundation.org/wp-content/uploads/2022/03/OMF-Logo-Final-R.png

