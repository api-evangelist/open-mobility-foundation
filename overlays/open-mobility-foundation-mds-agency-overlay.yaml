x-rationale: 'The OMF mds-openapi definitions (openapi/_original/mds-openapi/reference) ship untagged operations
  and a bearer securityScheme that is never applied as a requirement. This overlay adds resource tags and the root
  security requirement without mutating the original. No servers are added: MDS is a specification implemented by
  each city/operator, so there is no single provider host.'
