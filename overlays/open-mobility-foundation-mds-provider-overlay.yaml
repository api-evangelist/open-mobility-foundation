x-source: openapi/open-mobility-foundation-mds-provider-openapi.yml
x-rationale: 'The OMF mds-openapi definitions (openapi/_original/mds-openapi/reference) ship untagged operations
  and a bearer securityScheme that is never applied as a requirement. This overlay adds resource tags and the root
  security requirement without mutating the original. No servers are added: MDS is a specification implemented by
  each city/operator, so there is no single provider host.'
actions:
- target: $
  description: Add top-level tags derived from the first path segment of each operation.
  update:
    tags:
    - name: vehicles
      description: MDS Provider vehicles operations
    - name: trips
      description: MDS Provider trips operations
    - name: telemetry
      description: MDS Provider telemetry operations
    - name: events
      description: MDS Provider events operations
    - name: stops
      description: MDS Provider stops operations
    - name: reports
      description: MDS Provider reports operations
- target: $
  description: Spec declares securitySchemes ['bearer'] but no root security requirement; apply it globally.
  update:
    security:
    - bearer: []
- target: $.paths['/vehicles'].get
  description: Tag GET /vehicles by resource (vehicles) for grouping in docs and MCP tool categories.
