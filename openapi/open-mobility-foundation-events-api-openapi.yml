openapi: 3.2.0
info:
  title: Open Mobility Foundation Events API
  version: '2.0'
  contact:
    url: https://github.com/openmobilityfoundation/mobility-data-specification
    name: Open Mobility Foundation
    email: info@openmobilityfoundation.org
  license:
    name: Creative Commons Attribution 4.0 International Public License
    url: https://github.com/openmobilityfoundation/mobility-data-specification/blob/main/LICENSE
  description: 'Operations tagged Events across 2 of this provider''s published API definitions: open-mobility-foundation-mds-agency-openapi.yml, open-mobility-foundation-mds-provider-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Events
paths:
  /events:
    post:
      operationId: post-events
      description: Send vehicle state change events for multiple vehicles.
      summary: /events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/event'
      responses:
        '201':
          description: Events processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_bulk'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response_bulk'
                - required:
                  - failures
                  properties:
                    failures:
                      minItems: 1
                      items:
                        properties:
                          item:
                            $ref: '#/components/schemas/event'
                        oneOf:
                        - $ref: '#/components/schemas/response_error_bad_param'
                        - $ref: '#/components/schemas/response_error_missing_param'
        '404':
          description: The `device_id` is unregistered.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response_bulk'
                - required:
                  - failures
                  properties:
                    failures:
                      minItems: 1
                      items:
                        allOf:
                        - $ref: '#/components/schemas/response_error_unregistered'
                        - properties:
                            item:
                              $ref: '#/components/schemas/event'
        '401':
          description: 'Unauthorized: Invalid, expired, or insufficient scope of token.'
        '406':
          description: MDS version in Accept header is unsupported or invalid.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_error'
      tags:
      - Events
  /events/historical:
    parameters:
    - name: event_time
      schema:
        $ref: '#/components/schemas/data-types_iso-dayhour'
      in: query
      required: true
      description: The UTC hour during which events occurred.
    get:
      operationId: get-events-historical-event_time
      description: Get all status changes with an event time occurring within the hour.
      summary: /events/historical
      responses:
        '200':
          description: Hour has been processed.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/response_version'
                - type: object
                  description: Events data payload
                  required:
                  - events
                  properties:
                    events:
                      type: array
                      items:
                        $ref: '#/components/schemas/event'
        '202':
          description: Data is not yet available for this hour.
        '400':
          description: Request did not contain an `event_time`.
        '401':
          description: 'Unauthorized: Invalid, expired, or insufficient scope of token.'
        '404':
          description: Hour is not in the past, or no operations during this hour.
        '406':
          description: MDS version in Accept header is unsupported or invalid.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_error'
      tags:
      - Events
  /events/recent:
    parameters:
    - name: start_time
      schema:
        $ref: '#/components/schemas/data-types_timestamp'
      in: query
      required: true
      description: status changes where start_time <= event.timestamp
    - name: end_time
      schema:
        $ref: '#/components/schemas/data-types_timestamp'
      in: query
      required: true
      description: status changes where event.timestamp < end_time
    get:
      operationId: get-events-recent-start_time-end_time
      description: Get all status changes at most two weeks old.
      summary: /events/recent
      responses:
        '200':
          description: Range was valid and within the prior two weeks.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/response_version'
                - $ref: '#/components/schemas/response_paging'
                - type: object
                  description: Events data payload
                  required:
                  - events
                  properties:
                    events:
                      type: array
                      items:
                        $ref: '#/components/schemas/event'
        '400':
          description: Request did not contain a `start_time`, `end_time`, or the range was more than 2 weeks in the past.
        '401':
          description: 'Unauthorized: Invalid, expired, or insufficient scope of token.'
        '406':
          description: MDS version in Accept header is unsupported or invalid.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_error'
      tags:
      - Events
components:
  schemas:
    modes_delivery-robots_event:
      title: modes/delivery-robots/event
      description: Event definition for the `delivery-robots` mode.
      type: object
      x-stoplight:
        id: sksecq6lesbxa
      oneOf:
      - title: vehicle_state - removed
        properties:
          vehicle_state:
            const: removed
          event_types:
            items:
              enum:
              - comms_restored
              - decommissioned
              - located
              - maintenance_pick_up
      - title: vehicle_state - available
        properties:
          vehicle_state:
            const: available
          event_types:
            items:
              enum:
              - comms_restored
              - customer_cancellation
              - driver_cancellation
              - located
              - provider_cancellation
              - service_start
              - trip_end
              - trip_enter_jurisdiction
      - title: vehicle_state - non_operational
        properties:
          vehicle_state:
            const: non_operational
          event_types:
            items:
              enum:
              - comms_restored
              - located
              - maintenance
              - maintenance_end
              - recommissioned
              - service_end
              - trip_enter_jurisdiction
      - title: vehicle_state - reserved
        properties:
          vehicle_state:
            const: reserved
          event_types:
            items:
              enum:
              - comms_restored
              - located
              - reservation_start
              - trip_enter_jurisdiction
      - title: vehicle_state - on_trip
        properties:
          vehicle_state:
            const: on_trip
          event_types:
            items:
              enum:
              - comms_restored
              - located
              - trip_enter_jurisdiction
              - trip_resume
              - trip_start
      - title: vehicle_state - stopped
        properties:
          vehicle_state:
            const: stopped
          event_types:
            items:
              enum:
              - comms_restored
              - located
              - order_drop_off
              - order_pick_up
              - reservation_stop
              - trip_pause
      - title: vehicle_state - non_contactable
        properties:
          vehicle_state:
            const: non_contactable
          event_types:
            items:
              enum:
              - comms_lost
      - title: vehicle_state - missing
        properties:
          vehicle_state:
            const: missing
          event_types:
            items:
              enum:
              - not_located
      - title: vehicle_state - elsewhere
        properties:
          vehicle_state:
            const: elsewhere
          event_types:
            items:
              enum:
              - comms_restored
              - located
              - trip_leave_jurisdiction
      if:
        properties:
          event_types:
            contains:
            - customer_cancellation
            - driver_cancellation
            - provider_cancellation
            - reservation_start
            - reservation_stop
            - trip_end
            - trip_enter_jurisdiction
            - trip_leave_jurisdiction
            - trip_pause
            - trip_resume
            - trip_start
      then:
        properties:
          trip_ids:
            minItems: 1
