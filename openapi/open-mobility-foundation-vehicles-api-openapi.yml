openapi: 3.2.0
info:
  title: Open Mobility Foundation Vehicles API
  version: '2.0'
  contact:
    url: https://github.com/openmobilityfoundation/mobility-data-specification
    name: Open Mobility Foundation
    email: info@openmobilityfoundation.org
  license:
    name: Creative Commons Attribution 4.0 International Public License
    url: https://github.com/openmobilityfoundation/mobility-data-specification/blob/main/LICENSE
  description: 'Operations tagged Vehicles across 2 of this provider''s published API definitions: open-mobility-foundation-mds-agency-openapi.yml, open-mobility-foundation-mds-provider-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Vehicles
paths:
  /vehicles:
    post:
      operationId: post-vehicles
      description: Register vehicles for use in the Agency's jurisdiction.
      summary: /vehicles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/vehicle'
      responses:
        '201':
          description: Vehicles registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_bulk'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response_bulk'
                - required:
                  - failures
                  properties:
                    failures:
                      minItems: 1
                      items:
                        properties:
                          item:
                            $ref: '#/components/schemas/vehicle'
                        oneOf:
                        - $ref: '#/components/schemas/response_error_bad_param'
                        - $ref: '#/components/schemas/response_error_missing_param'
        '401':
          description: 'Unauthorized: Invalid, expired, or insufficient scope of token.'
        '406':
          description: MDS version in Accept header is unsupported or invalid.
        '409':
          description: Vehicle(s) already exist and an update is not possible.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response_bulk'
                - required:
                  - failures
                  properties:
                    failures:
                      minItems: 1
                      items:
                        allOf:
                        - $ref: '#/components/schemas/response_error_already_registered'
                        - properties:
                            item:
                              $ref: '#/components/schemas/vehicle'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_error'
      tags:
      - Vehicles
    put:
      operationId: put-vehicles
      description: Change vehicle information, should some aspect of the vehicle change, such as the `vehicle_id`. Each vehicle must already be registered.
      summary: /vehicles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/vehicle'
      responses:
        '200':
          description: Vehicles updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_bulk'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response_bulk'
                - required:
                  - failures
                  properties:
                    failures:
                      minItems: 1
                      items:
                        allOf:
                        - $ref: '#/components/schemas/response_error_bad_param'
                        - properties:
                            item:
                              $ref: '#/components/schemas/vehicle'
        '401':
          description: 'Unauthorized: Invalid, expired, or insufficient scope of token.'
        '404':
          description: Vehicles not found.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response_bulk'
                - required:
                  - failures
                  properties:
                    failures:
                      minItems: 1
                      items:
                        allOf:
                        - $ref: '#/components/schemas/response_error_unregistered'
                        - properties:
                            item:
                              $ref: '#/components/schemas/vehicle'
        '406':
          description: MDS version in Accept header is unsupported or invalid.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_error'
      tags:
      - Vehicles
    get:
      operationId: get-vehicles
      description: Get a list of vehicles in a Provider's registered fleet, with properties that do not change often.
      summary: /vehicles
      responses:
        '200':
          description: Vehicles found.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/response_version'
                - $ref: '#/components/schemas/response_paging'
                - type: object
                  description: Vehicles data payload
                  required:
                  - vehicles
                  properties:
                    vehicles:
                      type: array
                      items:
                        $ref: '#/components/schemas/vehicle'
        '401':
          description: 'Unauthorized: Invalid, expired, or insufficient scope of token.'
        '404':
          description: Vehicles not found.
        '406':
          description: MDS version in Accept header is unsupported or invalid.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_error'
      tags:
      - Vehicles
  /vehicles/{device_id}:
    parameters:
    - name: device_id
      schema:
        $ref: '#/components/schemas/data-types_uuid'
      in: path
      required: true
      description: The `device_id` of a Provider's Vehicle.
    get:
      operationId: get-vehicles-device_id
      description: Get the specified vehicle, with properties that do not change often.
      summary: /vehicles/{device_id}
      responses:
        '200':
          description: Vehicle found.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/response_version'
                - type: object
                  description: Vehicle data payload
                  required:
                  - vehicles
                  properties:
                    vehicles:
                      type: array
                      minItems: 1
                      maxItems: 1
                      items:
                        $ref: '#/components/schemas/vehicle'
        '400':
          description: Bad request.
        '401':
          description: 'Unauthorized: Invalid, expired, or insufficient scope of token.'
        '404':
          description: Vehicle not found.
        '406':
          description: MDS version in Accept header is unsupported or invalid.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_error'
      tags:
      - Vehicles
  /vehicles/status:
    get:
      operationId: get-vehicles-status
      description: Get a list of known vehicles, with specific vehicle status records that are updated frequently.
      summary: /vehicles/status
      responses:
        '200':
          description: Vehicles found.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/response_version'
                - $ref: '#/components/schemas/response_paging'
                - type: object
                  description: Vehicles status data payload
                  required:
                  - vehicles_status
                  properties:
                    vehicles_status:
                      type: array
                      items:
                        $ref: '#/components/schemas/vehicle-status'
        '401':
          description: 'Unauthorized: Invalid, expired, or insufficient scope of token.'
        '404':
          description: Vehicles not found.
        '406':
          description: MDS version in Accept header is unsupported or invalid.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_error'
      tags:
      - Vehicles
  /vehicles/status/{device_id}:
    parameters:
    - name: device_id
      schema:
        $ref: '#/components/schemas/data-types_uuid'
      in: path
      required: true
      description: The `device_id` of a Provider's vehicle.
    get:
      operationId: get-vehicles-status-device_id
      description: Get the specified vehicle, with vehicle status records that are updated frequently.
      summary: /vehicles/status/{device_id}
      responses:
        '200':
          description: Vehicle found.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/response_version'
                - type: object
                  description: Vehicles status data payload
                  required:
                  - vehicles_status
                  properties:
                    vehicles_status:
                      type: array
                      minItems: 1
                      maxItems: 1
                      items:
                        $ref: '#/components/schemas/vehicle-status'
        '400':
          description: Bad request.
        '401':
          description: 'Unauthorized: Invalid, expired, or insufficient scope of token.'
        '404':
          description: Vehicle not found.
        '406':
          description: MDS version in Accept header is unsupported or invalid.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_error'
      tags:
      - Vehicles
components:
  schemas:
    data-types_propulsion-type-array:
      title: data-types/propulsion-type-array
      description: Array of propulsion types, allowing multiple values.
      items:
        $ref: '#/components/schemas/data-types_propulsion-type'
      type: array
      uniqueItems: true
      x-stoplight:
        id: 4ao4xw23z8wrf
    event:
      title: models/event
      description: Events represent changes in [Vehicle Status](./vehicle-status.yaml).
      type: object
      x-stoplight:
        id: 34niv0zuhmwmg
      required:
      - device_id
      - provider_id
      - event_id
      - vehicle_state
      - event_types
      - timestamp
      allOf:
      - properties:
          device_id:
            $ref: '#/components/schemas/data-types_uuid'
            description: A unique device ID in UUID format.
          provider_id:
            $ref: '#/components/schemas/data-types_uuid'
            description: A UUID for the Provider, unique within MDS. See MDS [provider list](https://github.com/openmobilityfoundation/mobility-data-specification/blob/main/providers.csv).
          data_provider_id:
            $ref: '#/components/schemas/data-types_uuid'
            description: If different than `provider_id`, a UUID for the data solution provider managing the data feed in this endpoint.
          event_id:
            $ref: '#/components/schemas/data-types_uuid'
            description: A unique event ID in UUID format.
          vehicle_state:
            $ref: '#/components/schemas/data-types_vehicle-state'
            description: The state of the vehicle as of this event.
          event_types:
            $ref: '#/components/schemas/data-types_event-type-array'
            description: Vehicle event types for state change.
          timestamp:
            $ref: '#/components/schemas/data-types_timestamp'
            description: Date/time that event occurred.
          publication_time:
            $ref: '#/components/schemas/data-types_timestamp'
            description: Date/time event became available through the status changes endpoint.
          location:
            $ref: '#/components/schemas/data-types_gps'
            description: Location of the event.
          event_geographies:
            $ref: '#/components/schemas/data-types_uuid-array'
            description: Array of Geography UUIDs consisting of every Geography that contains the location of the status change. See Geography Driven Events. Required if location is not present.
          battery_percent:
            $ref: '#/components/schemas/data-types_integer-positive'
            description: Percent battery charge of vehicle, expressed between 0 and 100.
            maximum: 100
          fuel_percent:
            $ref: '#/components/schemas/data-types_integer-positive'
            description: Percent fuel in vehicle, expressed between 0 and 100.
            maximum: 100
          trip_ids:
            $ref: '#/components/schemas/data-types_uuid-array'
            description: Trip UUIDs (foreign key to /trips endpoint), conditionally required for different modes.
          associated_ticket:
            $ref: '#/components/schemas/data-types_string'
            description: Identifier for an associated ticket inside an Agency-maintained 311 or CRM system.
      - oneOf:
        - title: modes/car-share
          $ref: '#/components/schemas/modes_car-share_event'
        - title: modes/delivery-robots
          $ref: '#/components/schemas/modes_delivery-robots_event'
        - title: modes/micromobility
          $ref: '#/components/schemas/modes_micromobility_event'
        - title: modes/passenger-services
          $ref: '#/components/schemas/modes_passenger-services_event'
      - anyOf:
        - title: Location-based event
          required:
          - location
        - title: Geography-driven event
          required:
          - event_geographies
          properties:
            event_geographies:
              minItems: 1
    response_error_unregistered:
      title: response/error_unregistered
      description: An item with that identifier is not registered.
      type: object
      x-stoplight:
        id: cw4q7ycy1a17h
      required:
      - item
      - error
      - error_description
      properties:
        error:
          const: unregistered
        error_description:
          type: string
          examples:
          - This device_id is not registered.
          - This stop_id is unregistered
        error_details:
          type: array
          items:
            type: string
    response_paging:
      title: response/paging
      type: object
      x-stoplight:
        id: y6kgbr644ng4u
      properties:
        links:
          description: If pagination is used for endpoints that support it, the pagination must comply with the [JSON API](http://jsonapi.org/format/#fetching-pagination) specification.
          type: object
          required:
          - next
          additionalProperties: false
          properties:
            first:
              type:
              - 'null'
              - string
              title: The URL to the first page of data.
              examples:
              - https://data.provider.co/trips/first
              format: uri
            last:
              type:
              - 'null'
              - string
              title: The URL to the last page of data.
              examples:
              - https://data.provider.co/trips/last
              format: uri
            prev:
              type:
              - 'null'
              - string
              title: The URL to the previous page of data.
              examples:
              - https://data.provider.co/trips/prev
              format: uri
            next:
              type:
              - 'null'
              - string
              title: The URL to the next page of data.
              examples:
              - https://data.provider.co/trips/next
              format: uri
    modes_car-share_vehicle:
      title: modes/car-share/vehicle
      description: Vehicle definition for the `car-share` mode.
      type: object
      x-stoplight:
        id: ept949jym2d7l
      properties:
        accessibility_attributes:
          $ref: '#/components/schemas/modes_car-share_accessibility-attributes'
          description: The accessibility options available on a given vehicle. Required if available.
        vehicle_attributes:
          type: object
          description: Many of these attributes come from fields in [GBFS vehicle_types](https://github.com/MobilityData/gbfs/blob/v2.3/gbfs.md#vehicle_typesjson).
          additionalProperties: false
          required:
          - year
          - make
          - model
          - color
          - vin
          - license_plate
          properties:
            year:
              $ref: '#/components/schemas/data-types_minimum-year'
            make:
              $ref: '#/components/schemas/data-types_string'
            model:
              $ref: '#/components/schemas/data-types_string'
            color:
              $ref: '#/components/schemas/data-types_string'
            vin:
              $ref: '#/components/schemas/data-types_string'
              description: The vehicle's Vehicle Identification Number.
            placard_number:
              $ref: '#/components/schemas/data-types_string'
              description: The registered placard number of the vehicle.
            license_plate:
              $ref: '#/components/schemas/data-types_string'
              description: The registered vehicle license/number/registration plate identifier on the vehicle.
            inspection_date:
              $ref: '#/components/schemas/data-types_iso-date'
              description: The date of the last inspection of the vehicle in ISO 8601 `YYYY-MM-DD`.
            snow_shovel:
              type: boolean
              description: Vehicle has a shovel for removing snow or ice from around vehicle or vehicle path.
            snow_brush:
              type: boolean
              description: Vehicle has brushes for removing snow or ice from vehicle.
            bike_rack:
              type: boolean
              description: Vehicle has car roof or trunk mounted bike rack.
            park_access:
              type: boolean
              description: Vehicle has an access pass to a national/regional/municipal park system.
            toll_transponder:
              type: boolean
              description: Vehicle has a toll transponder for national/regional toll system.
            phone_charger:
              type: boolean
              description: Vehicle has a place to charge a cellphone.
            sunshade:
              type: boolean
              description: Vehicle has a sunshade available (i.e. for windshield).
            cargo_volume_capacity:
              $ref: '#/components/schemas/data-types_integer-positive'
              description: Cargo volume available in the vehicle, expressed in liters. For cars, it corresponds to the space between the boot floor, including the storage under the hatch, to the rear shelf in the trunk.
            cargo_load_capacity:
              $ref: '#/components/schemas/data-types_integer-positive'
              description: The capacity of the vehicle cargo space (excluding passengers), expressed in kilograms.
            door_count:
              $ref: '#/components/schemas/data-types_integer-positive'
              description: The number of doors this vehicle type has.
            wheel_count:
              $ref: '#/components/schemas/data-types_integer-positive'
              description: The number of doors this vehicle type has.
            air_conditioning:
              type: boolean
              description: Vehicle has air conditioning.
            gear_switch:
              type: string
              enum:
              - automatic
              - manual
            convertible:
              type: boolean
              description: Vehicle has a retractable roof.
            cruise_control:
              type: boolean
              description: Vehicle has a cruise control system.
            navigation:
              type: boolean
              description: Vehicle has a built-in navigation system.
    response_error_bad_param:
      title: response/error_bad_param
      description: A validation error occurred.
      type: object
      x-stoplight:
        id: vekidez6dfa4u
      required:
      - item
      - error
      - error_description
      - error_details
      properties:
        error:
          const: bad_param
        error_description:
          type: string
          examples:
          - A validation error occurred
        error_details:
          type: array
          description: Array of parameters with errors.
          minItems: 1
          items:
            type: string
    modes_car-share_accessibility-attributes:
      title: modes/car-share/accessibility-attributes
      description: Accessibility options definition for the `car-share` mode.
      type: array
      x-stoplight:
        id: e9mpudr8layzh
      uniqueItems: true
      items:
        type: string
        enum:
        - wheelchair_accessible
    modes_delivery-robots_vehicle:
      title: modes/delivery-robots/vehicle
      description: Vehicle definition for the `delivery-robots` mode.
      type: object
      x-stoplight:
        id: 01xpq0lxoywf6
      properties:
        accessibility_attributes:
          $ref: '#/components/schemas/modes_delivery-robots_accessibility-attributes'
          description: The accessibility options available on a given delivery robot device. Required if available.
        vehicle_attributes:
          type: object
          additionalProperties: false
          properties:
            year:
              $ref: '#/components/schemas/data-types_minimum-year'
            make:
              $ref: '#/components/schemas/data-types_string'
            model:
              $ref: '#/components/schemas/data-types_string'
            color:
              $ref: '#/components/schemas/data-types_string'
            inspection_date:
              $ref: '#/components/schemas/data-types_iso-date'
              description: The date of the last inspection of the vehicle in ISO 8601 `YYYY-MM-DD`.
            equipped_cameras:
              $ref: '#/components/schemas/data-types_integer-positive'
              description: The number of cameras equipped on device.
            equipped_lighting:
              $ref: '#/components/schemas/data-types_integer-positive'
              description: The  number of lights used to illuminate the environment on the the device.
            wheel_count:
              $ref: '#/components/schemas/data-types_integer-positive'
              description: The number of wheels on the device.
            width:
              $ref: '#/components/schemas/data-types_integer-positive'
              description: The width in meters of the device.
            length:
              $ref: '#/components/schemas/data-types_integer-positive'
              description: The length in meters of the device.
            height:
              $ref: '#/components/schemas/data-types_integer-positive'
              description: The height in meters of the device (minus flexible elements like flags).
            weight:
              $ref: '#/components/schemas/data-types_integer-positive'
              description: The weight in kilograms rounded up of the device not including cargo.
            top_speed:
              $ref: '#/components/schemas/data-types_integer-positive'
              description: The theoretical top speed in meters per second of the device.
            storage_capacity:
              $ref: '#/components/schemas/data-types_integer-positive'
              description: The volume in cubic centimeters of cargo space available not including any cargo.
    response_bulk:
      title: response/bulk
      type: object
      description: For multi-record POST and PUT calls, e.g. sending Events using the Agency API, the bulk-response structure describes a list of results.
      x-stoplight:
        id: sdj75536ytrso
      required:
      - success
      - total
      properties:
        success:
          $ref: '#/components/schemas/data-types_integer-positive'
          description: Number of successfully written records.
        total:
          $ref: '#/components/schemas/data-types_integer-positive'
          description: Total number of provided records.
        failures:
          type: array
    data-types_integer-positive:
      title: data-types/integer-positive
      description: An integer greater than or equal to 0.
      minimum: 0
      type: integer
      x-stoplight:
        id: nfkphjmpm8yay
    data-types_propulsion-type:
      title: data-types/propulsion-type
      description: The allowed types of propulsion in MDS. Based off of `propulsion_type` in [GBFS vehicle_types](https://github.com/MobilityData/gbfs/blob/master/gbfs.md#vehicle_typesjson)
      enum:
      - human
      - electric_assist
      - electric
      - combustion
      - combustion_diesel
      - hybrid
      - hydrogen_fuel_cell
      - plug_in_hybrid
      type: string
      x-stoplight:
        id: 1ucdttnwhf2bo
    modes_micromobility_accessibility-attributes:
      title: modes/micromobility/accessibility-attributes
      description: Accessibility options definition for the `micromobility` mode.
      type: array
      x-stoplight:
        id: 15do56zc6v30i
      uniqueItems: true
      items:
        type: string
        enum:
        - adaptive
    data-types_event-type-array:
      title: data-types/event-type-array
      description: Array of events indicating a change to a vehicle's state.
      items:
        $ref: '#/components/schemas/data-types_event-type'
      minItems: 1
      type: array
      uniqueItems: true
      x-stoplight:
        id: 1dq8fejw6intb
    data-types_event-type:
      title: data-types/event-type
      description: Events are possible transitions between vehicle states.
      enum:
      - agency_drop_off
      - agency_pick_up
      - battery_charged
      - battery_low
      - changed_geographies
      - charging_end
      - charging_start
      - comms_lost
      - comms_restored
      - compliance_pick_up
      - customer_cancellation
      - decommissioned
      - driver_cancellation
      - fueling_end
      - fueling_start
      - located
      - maintenance
      - maintenance_end
      - maintenance_pick_up
      - not_located
      - off_hours
      - on_hours
      - order_drop_off
      - order_pick_up
      - passenger_cancellation
      - provider_cancellation
      - provider_drop_off
      - rebalance_pick_up
      - recommission
      - remote_end
      - remote_start
      - reservation_cancel
      - reservation_start
      - reservation_stop
      - service_end
      - service_start
      - system_resume
      - system_suspend
      - trip_cancel
      - trip_end
      - trip_enter_jurisdiction
      - trip_leave_jurisdiction
      - trip_pause
      - trip_resume
      - trip_start
      - trip_stop
      - unspecified
      type: string
      x-stoplight:
        id: lsm5td7gknbxz
    data-types_gps:
      title: data-types/gps
      properties:
        altitude:
          description: Altitude above mean sea level in meters.
          type: number
        heading:
          description: Degrees - clockwise starting at 0 degrees at true North.
          type: number
        horizontal_accuracy:
          description: Horizontal accuracy in meters.
          type: number
        lat:
          description: Latitude coordinate.
          maximum: 90
          minimum: -90
          type: number
        lng:
          description: Longitude coordinate.
          maximum: 180
          minimum: -180
          type: number
        satellites:
          $ref: '#/components/schemas/data-types_integer-positive'
          description: Number of GPS or GNSS satellites.
        speed:
          description: Estimated speed in meters / sec as reported by the GPS chipset.
          type: number
        vertical_accuracy:
          description: Vertical accuracy in meters.
          type: number
      required:
      - lat
      - lng
      type: object
      x-stoplight:
        id: 8aooo5ag7x7vh
    data-types_uuid-array:
      title: data-types/uuid-array
      description: Array of UUID.
      type: array
      x-stoplight:
        id: v932clitbqv31
      uniqueItems: true
      items:
        $ref: '#/components/schemas/data-types_uuid'
    modes_delivery-robots_event:
      title: modes/delivery-robots/event
      description: Event definition for the `delivery-robots` mode.
      type: object
      x-stoplight:
        id: sksecq6lesbxa
      oneOf:
      - title: vehicle_state - removed
        properties:
          vehicle_state:
            const: removed
          event_types:
            items:
              enum:
              - comms_restored
              - decommissioned
              - located
              - maintenance_pick_up
      - title: vehicle_state - available
